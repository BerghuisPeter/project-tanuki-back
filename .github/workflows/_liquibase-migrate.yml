name: Execute Liquibase Migration

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      GCP_SA_KEY:
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Execute Liquibase Migration Job
        run: |
          # Map service to its specific schema
          if [ "${{ inputs.service_name }}" == "auth-service" ]; then
            SCHEMA="auth_schema"
          elif [ "${{ inputs.service_name }}" == "profile-service" ]; then
            SCHEMA="profile_schema"
          else
            SCHEMA="goshuin_schema"
          fi

          gcloud run jobs execute liquibase-migration-${{ inputs.environment }} \
            --region=${{ vars.GAR_LOCATION }} \
            --update-env-vars SERVICE_NAME=${{ inputs.service_name }},LIQUIBASE_COMMAND_CHANGELOG_FILE=db/changelog/${{ inputs.service_name }}/db.changelog-master.yaml,LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME=$SCHEMA \
            --wait
