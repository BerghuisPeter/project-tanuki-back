name: Tanuki CI/CD

on:
  push:
    branches: [ develop, master ]
    paths-ignore:
      - 'services/enrichment-worker/**'
  workflow_dispatch:

jobs:
  # Check which files changed to optimize builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service }}
      profile-service: ${{ steps.filter.outputs.profile-service }}
      goshuin-service: ${{ steps.filter.outputs.goshuin-service }}
      global: ${{ steps.filter.outputs.global }}
      liquibase: ${{ steps.filter.outputs.liquibase }}
      liquibase-auth-service: ${{ steps.filter.outputs.liquibase-auth-service }}
      liquibase-profile-service: ${{ steps.filter.outputs.liquibase-profile-service }}
      liquibase-goshuin-service: ${{ steps.filter.outputs.liquibase-goshuin-service }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            global:
              - 'libs/common/**'
              - 'libs/security/**'
              - 'pom.xml'
              - 'Dockerfile'
              - '.github/workflows/**'
            liquibase:
              - 'libs/liquibase/**'
            liquibase-auth-service:
              - 'libs/liquibase/src/main/resources/db/changelog/auth-service/**'
            liquibase-profile-service:
              - 'libs/liquibase/src/main/resources/db/changelog/profile-service/**'
            liquibase-goshuin-service:
              - 'libs/liquibase/src/main/resources/db/changelog/goshuin-service/**'
            auth-service:
              - 'services/auth-service/**'
            profile-service:
              - 'services/profile-service/**'
            goshuin-service:
              - 'services/goshuin-service/**'

      - name: Calculate service matrix
        id: set-matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.filter.outputs.global }}" == "true" ]]; then
            echo "matrix=[\"auth-service\", \"profile-service\", \"goshuin-service\"]" >> $GITHUB_OUTPUT
          else
            SERVICES=()
            [[ "${{ steps.filter.outputs.auth-service }}" == "true" ]] && SERVICES+=("\"auth-service\"")
            [[ "${{ steps.filter.outputs.profile-service }}" == "true" ]] && SERVICES+=("\"profile-service\"")
            [[ "${{ steps.filter.outputs.goshuin-service }}" == "true" ]] && SERVICES+=("\"goshuin-service\"")
          
            # Join array with commas
            IFS=,
            echo "matrix=[${SERVICES[*]}]" >> $GITHUB_OUTPUT
          fi

  liquibase-build:
    needs: [ changes ]
    # Only build the migration image if any liquibase files changed, or if it's a manual dispatch
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.liquibase == 'true'
    uses: ./.github/workflows/_liquibase-build.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    with:
      service_name: "liquibase"
      image_name: "liquibase-migration"
      environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}

  liquibase-update-job:
    needs: [ changes, liquibase-build ]
    # Update the job image once before executing parallel migrations
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.liquibase == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Update Cloud Run Job Image
        run: |
          ENVIRONMENT=${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
          IMAGE="${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/liquibase-migration:${{ github.sha }}"
          
          gcloud run jobs update liquibase-migration-${ENVIRONMENT} \
            --image=$IMAGE \
            --region=${{ vars.GAR_LOCATION }}

  liquibase-migrate:
    needs: [ changes, liquibase-build, liquibase-update-job ]
    # Run if liquibase files changed OR manual dispatch.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.liquibase == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    strategy:
      matrix:
        service: [ auth-service, profile-service, goshuin-service ]
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Execute Liquibase Migration Job
        # Only run migration for the service if its specific liquibase files changed, or if it's a manual dispatch
        if: |
          github.event_name == 'workflow_dispatch' || 
          needs.changes.outputs[format('liquibase-{0}', matrix.service)] == 'true'
        run: |
          ENVIRONMENT=${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
          
          # Map service to its specific schema
          if [ "${{ matrix.service }}" == "auth-service" ]; then
            SCHEMA="auth_schema"
          elif [ "${{ matrix.service }}" == "profile-service" ]; then
            SCHEMA="profile_schema"
          else
            SCHEMA="goshuin_schema"
          fi

          # Execute the migration with the corrected path to the master changelog and specify the schema
          gcloud run jobs execute liquibase-migration-${ENVIRONMENT} \
            --region=${{ vars.GAR_LOCATION }} \
            --update-env-vars SERVICE_NAME=${{ matrix.service }},LIQUIBASE_COMMAND_CHANGELOG_FILE=db/changelog/${{ matrix.service }}/db.changelog-master.yaml,LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME=$SCHEMA \
            --wait
  
  build-and-deploy:
    needs: [ changes, liquibase-migrate ]
    # services build if matrix is not empty.
    # Wait for migrations to finish (success or skipped).
    if: |
      always() &&
      needs.changes.outputs.matrix != '[]' &&
      (needs.liquibase-migrate.result == 'success' || needs.liquibase-migrate.result == 'skipped')
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/_build-push.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    with:
      service_name: ${{ matrix.service }}
      image_name: ${{ matrix.service }}
      environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
