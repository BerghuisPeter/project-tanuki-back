name: Tanuki CI/CD

on:
  push:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  # Check which files changed to optimize builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      global: ${{ steps.filter.outputs.global }}
      liquibase: ${{ steps.filter.outputs.liquibase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            global:
              - 'libs/common/**'
              - 'libs/security/**'
              - 'pom.xml'
              - 'Dockerfile'
              - '.github/workflows/**'
            liquibase:
              - 'libs/liquibase/**'
            liquibase-auth-service:
              - 'libs/liquibase/src/main/resources/db/changelog/auth-service/**'
            liquibase-profile-service:
              - 'libs/liquibase/src/main/resources/db/changelog/profile-service/**'
            liquibase-goshuin-service:
              - 'libs/liquibase/src/main/resources/db/changelog/goshuin-service/**'
            auth-service:
              - 'services/auth-service/**'
            profile-service:
              - 'services/profile-service/**'
            goshuin-service:
              - 'services/goshuin-service/**'

  liquibase-build:
    needs: [ changes ]
    # Only build the migration image if any liquibase files changed, or if it's a manual dispatch/global change
    if: |
      github.event_name == 'workflow_dispatch' || 
      needs.changes.outputs.global == 'true' || 
      needs.changes.outputs.liquibase == 'true'
    uses: ./.github/workflows/_liquibase-build.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    with:
      service_name: "liquibase"
      image_name: "liquibase-migration"
      environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}

  liquibase-update-job:
    needs: [ changes, liquibase-build ]
    # Update the job image once before executing parallel migrations
    if: |
      always() && 
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.liquibase == 'true' || needs.changes.outputs.global == 'true') &&
      (needs.liquibase-build.result == 'success' || needs.liquibase-build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Update Cloud Run Job Image
        run: |
          ENVIRONMENT=${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
          IMAGE="${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/liquibase-migration:${{ github.sha }}"
          
          gcloud run jobs update liquibase-migration-${ENVIRONMENT} \
            --image=$IMAGE \
            --region=${{ vars.GAR_LOCATION }}

  liquibase-migrate:
    needs: [ changes, liquibase-build, liquibase-update-job ]
    # Run if liquibase files changed OR manual dispatch.
    if: |
      always() && 
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.liquibase == 'true' || needs.changes.outputs.global == 'true') &&
      (needs.liquibase-build.result == 'success' || needs.liquibase-build.result == 'skipped') &&
      (needs.liquibase-update-job.result == 'success' || needs.liquibase-update-job.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    strategy:
      matrix:
        service: [ auth-service, profile-service, goshuin-service ]
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Execute Liquibase Migration Job
        # Only run migration for the service if its specific liquibase files changed, or if it's a manual dispatch/global change
        if: |
          github.event_name == 'workflow_dispatch' || 
          needs.changes.outputs.global == 'true' || 
          needs.changes.outputs[format('liquibase-{0}', matrix.service)] == 'true'
        run: |
          ENVIRONMENT=${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
          
          # Map service to its specific schema
          if [ "${{ matrix.service }}" == "auth-service" ]; then
            SCHEMA="auth_schema"
          elif [ "${{ matrix.service }}" == "profile-service" ]; then
            SCHEMA="profile_schema"
          else
            SCHEMA="goshuin_schema"
          fi

          # Execute the migration with the corrected path to the master changelog and specify the schema
          gcloud run jobs execute liquibase-migration-${ENVIRONMENT} \
            --region=${{ vars.GAR_LOCATION }} \
            --update-env-vars SERVICE_NAME=${{ matrix.service }},LIQUIBASE_COMMAND_CHANGELOG_FILE=db/changelog/${{ matrix.service }}/db.changelog-master.yaml,LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME=$SCHEMA \
            --wait

  build-and-deploy:
    needs: [ changes, liquibase-migrate ]
    # services build if services changed OR global changed OR manual dispatch.
    # Wait for migrations to finish (success or skipped).
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.global == 'true' || needs.changes.outputs.services != '[]') &&
      (needs.liquibase-migrate.result == 'success' || needs.liquibase-migrate.result == 'skipped')
    strategy:
      matrix:
        service: ${{ fromJson((github.event_name == 'workflow_dispatch' || needs.changes.outputs.global == 'true') && '["auth-service", "profile-service", "goshuin-service"]' || needs.changes.outputs.services) }}
      fail-fast: false
    uses: ./.github/workflows/_build-push.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    with:
      service_name: ${{ matrix.service }}
      image_name: ${{ matrix.service }}
      environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
