name: Tanuki CI/CD

on:
  push:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  # Check which files changed to optimize builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      global: ${{ steps.filter.outputs.global }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            global:
              - 'libs/**'
              - 'pom.xml'
              - 'Dockerfile'
              - '.github/workflows/**'
            auth-service:
              - 'services/auth-service/**'
            profile-service:
              - 'services/profile-service/**'

  build-and-deploy:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.global == 'true' || needs.changes.outputs.services != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJson((github.event_name == 'workflow_dispatch' || needs.changes.outputs.global == 'true') && '["auth-service", "profile-service"]' || needs.changes.outputs.services) }}
      fail-fast: false
    uses: ./.github/workflows/_build-push.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    with:
      service_name: ${{ matrix.service }}
      image_name: ${{ matrix.service }}
      environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
