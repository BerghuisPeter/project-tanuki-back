openapi: 3.0.3
info:
  title: Profile Service API
  description: Profile management service for Project Tanuki
  version: 0.0.1-SNAPSHOT
servers:
  - url: http://localhost:8082
    description: Local development server
paths:
  /api/v1/profile:
    get:
      summary: Get user profile
      operationId: getUserProfile
      tags:
        - Profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update user profile (upsert)
      operationId: updateUserProfile
      tags:
        - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/profile/upload-url:
    get:
      summary: Get a signed URL for avatar upload
      operationId: getAvatarUploadUrl
      tags:
        - Profile
      parameters:
        - name: contentType
          in: query
          required: true
          schema:
            type: string
          example: "image/jpeg"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    UploadUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
        fileName:
          type: string
        maxSizeBytes:
          type: integer
          format: int64
          example: 5242880
        allowedContentTypes:
          type: array
          items:
            type: string
          example: [ "image/jpeg", "image/png", "image/webp" ]
    UserProfile:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 45
        color:
          type: string
          pattern: '^$|^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'
          description: "Hexadecimal color code (e.g., #FF5733) or empty string"
        locale:
          type: string
          example: "en-US"
        avatarUrl:
          type: string
          pattern: '^$|^(https?|ftp)://[^\s/$.?#].[^\s]*$'
          description: "Must be a valid URL or empty string"
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
