openapi: 3.0.3
info:
  title: Goshuin Service API
  description: Goshuin management service for Project Tanuki
  version: 0.0.1-SNAPSHOT
servers:
  - url: http://localhost:8083
    description: Local development server
paths:
  /api/v1/goshuin:
    get:
      summary: Search goshuins
      operationId: searchGoshuins
      tags:
        - Goshuin
      parameters:
        - name: format
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GoshuinFormat'
        - name: pages
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int32
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: affiliation
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AffiliationType'
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GoshuinSort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goshuin'
    post:
      summary: Add a new goshuin
      operationId: addGoshuin
      tags:
        - Goshuin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoshuinCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goshuin'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/goshuin/comments/count:
    post:
      summary: Get comment counts for a list of goshuin IDs
      operationId: getGoshuinCommentCounts
      tags:
        - Goshuin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/temples:
    get:
      summary: Get all temples
      operationId: getTemples
      tags:
        - Temple
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Temple'
    post:
      summary: Add a new temple
      operationId: addTemple
      tags:
        - Temple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TempleCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Temple'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Temple:
      type: object
      required:
        - id
        - translations
        - longitude
        - latitude
        - affiliationType
      properties:
        id:
          type: string
          format: uuid
        translations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TempleTranslation'
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
        affiliationType:
          $ref: '#/components/schemas/AffiliationType'
        websiteUrl:
          type: string
          format: uri
        phoneNumber:
          type: string
        goshuinType:
          $ref: '#/components/schemas/GoshuinFormat'
        goshuinServiceOpenUntil:
          type: string
          format: partial-time
          example: "16:00"
        imageUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    TempleCreate:
      type: object
      required:
        - translations
        - longitude
        - latitude
        - affiliationType
      properties:
        translations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TempleTranslation'
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
        affiliationType:
          $ref: '#/components/schemas/AffiliationType'
        websiteUrl:
          type: string
          format: uri
        phoneNumber:
          type: string
        goshuinType:
          $ref: '#/components/schemas/GoshuinFormat'
        goshuinServiceOpenUntil:
          type: string
          format: partial-time
          example: "16:00"
        imageUrl:
          type: string
          format: uri

    TempleTranslation:
      type: object
      required:
        - name
        - region
        - postalCode
        - prefecture
        - city
        - address
      properties:
        name:
          type: string
        region:
          type: string
        postalCode:
          type: string
        prefecture:
          type: string
        city:
          type: string
        address:
          type: string
        description:
          type: string

    AffiliationType:
      type: string
      enum:
        - buddhist
        - shinto

    GoshuinFormat:
      type: string
      enum:
        - written
        - paper
        - cut
        - other

    GoshuinSort:
      type: string
      enum:
        - commentCount
        - createdAt
        - nearby

    Goshuin:
      type: object
      required:
        - id
        - creator
        - format
        - temple
        - pages
        - translations
      properties:
        id:
          type: string
          format: uuid
        creator:
          $ref: '#/components/schemas/Creator'
        format:
          $ref: '#/components/schemas/GoshuinFormat'
        temple:
          $ref: '#/components/schemas/TempleLite'
        pages:
          type: integer
          format: int32
          default: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        translations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GoshuinTranslation'
        images:
          type: array
          items:
            $ref: '#/components/schemas/GoshuinImage'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        commentCount:
          type: integer
          format: int32
          readOnly: true
          description: The number of comments on this goshuin

    Creator:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
        profile:
          $ref: '#/components/schemas/UserProfile'

    GoshuinCreate:
      type: object
      required:
        - userId
        - format
        - templeId
        - pages
        - translations
      properties:
        userId:
          type: string
          format: uuid
        format:
          $ref: '#/components/schemas/GoshuinFormat'
        templeId:
          type: string
          format: uuid
        pages:
          type: integer
          format: int32
          default: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        translations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GoshuinTranslation'
        images:
          type: array
          items:
            $ref: '#/components/schemas/GoshuinImage'
    GoshuinTranslation:
      type: object
      properties:
        label:
          type: string
        description:
          type: string
    GoshuinImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
    TempleLite:
      type: object
      required:
        - id
        - affiliationType
        - translations
        - longitude
        - latitude
      properties:
        id:
          type: string
          format: uuid
        affiliationType:
          $ref: '#/components/schemas/AffiliationType'
        translations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TempleTranslation'
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        displayName:
          type: string
        color:
          type: string
        avatarUrl:
          type: string
        locale:
          type: string



