spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:583627204016-5o809inoo1hs877478cqtthd15h0a3hn.apps.googleusercontent.com}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/tanuki-db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:myuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:secret}}
  liquibase:
    enabled: false
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.CockroachDialect
        jdbc:
          lob:
            non_contextual_creation: true

jwt:
  secret: ${JWT_SECRET:devSecretKeyForProjectTanukiMustBeAtLeast32BytesLong}
  expiration: ${JWT_EXPIRATION:300000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:172800000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://dev.project-tanuki.net}
  frontend-url: ${FRONT_URL:http://localhost:4200}

logging:
  level:
    io.github.peterberghuis: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE