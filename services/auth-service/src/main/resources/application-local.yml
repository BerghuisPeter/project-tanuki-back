spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:583627204016-5o809inoo1hs877478cqtthd15h0a3hn.apps.googleusercontent.com}
            redirect-uri: "{baseUrl}${GOOGLE_REDIRECT_URI:/login/oauth2/code/{registrationId}}"
  datasource:
    url: jdbc:postgresql://localhost:5432/tanuki-db
    username: myuser
    password: secret
  liquibase:
    enabled: true
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: test-secret-key-that-needs-to-be-long-enough-to-be-secure-32-chars
  expiration: 900000
  refresh-expiration: 604800000

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}
  frontend-url: ${FRONT_URL:http://localhost:4200}

logging:
  level:
    io.github.peterberghuis: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE