services:
  tanuki-db:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=tanuki-db'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - tanuki-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d tanuki-db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  tile-server:
    image: 'maptiler/tileserver-gl:latest'
    volumes:
      - ./tileserver-data:/data # Map your local folder to the container
    ports:
      - '8084:8080'

volumes:
  tanuki-db-data: